actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and VideaHealth publishes no public API
    of any kind. The company entry is recorded as an honest gated stub: apis: []
    in apis.yml, with the plausible logical API areas captured here as an explicit
    model (endpointsModeled: true) rather than fabricated as real endpoints. No
    AsyncAPI document was created because there is no documented public transport
    - WebSocket, SSE, or otherwise - to describe.
